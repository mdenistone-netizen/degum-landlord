function parse(raw){const t=raw.replace(/\s+/g,' ').trim(),d={miss:[],sender:'',phone:'',ptime:''};let m=t.match(/\b([A-Z0-9]{6,12})\s*[,.]?\s*confirmed/i);d.code=m?m[1].toUpperCase():'';

/* ================= SYSTEM 2 — Degum Landlord =================

   · ALLOCATIONS (what a payment settles). Tenant balance = valid charges - valid payments (allocated or not). */
const live=()=>S.tenants.filter(t=>!t.deleted),actv=()=>live().filter(t=>t.active),T_=id=>S.tenants.find(t=>t.id===id),CH=id=>S.channels.find(c=>c.id===id),TY=id=>S.ctypes.find(c=>c.id===id);

function acct(tid){const ch=S.charges.filter(c=>c.tid===tid&&!c.cancelled).sort((a,b)=>a.due<b.due?-1:1),ps=validPays(tid),billed=r2(ch.reduce((s,c)=>s+c.amount,0)),dr=depRecv(ps),ap=depApplied(tid),paid=r2(ps.reduce((s,p)=>s+p.amount,0)-dr),by={};
 ch.forEach(c=>{const b=by[c.ty]||(by[c.ty]={ty:c.ty,charged:0,alloc:0});b.charged=r2(b.charged+c.amount)});let un=0;
 ps.forEach(p=>{(p.alloc||[]).forEach(a=>{if(isDep(a.ty))return;const b=by[a.ty]||(by[a.ty]={ty:a.ty,charged:0,alloc:0});b.alloc=r2(b.alloc+a.amt)});un=r2(un+p.amount-allocSum(p))});
