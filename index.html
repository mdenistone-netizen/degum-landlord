function repBody(){const m=month,pm=validPays().filter(p=>p.date.slice(0,7)===m),cm=S.charges.filter(c=>!c.cancelled&&c.month===m),sum=a=>r2(a.reduce((s,x)=>s+x,0));
 switch(ui.rep){case'collection':{const e=sum(cm.map(c=>c.amount)),c=sum(pm.map(opAmt)),o=sum(actv().map(t=>acct(t.id).out));return`<div class="cards">${card('Expected',money(e))}${card('Collected',money(c),'g')}${card('Outstanding (all)',money(o),'r')}${card('Collection rate',e?Math.min(100,Math.round(c/e*100))+'%':'—')}</div>`}
 case'balances':return tbl(['Tenant','Unit','Charges','Paid','Outstanding'],live().map(t=>({t,a:acct(t.id)})).filter(x=>x.a.billed||x.a.paid).map(({t,a})=>[esc(t.name),esc(t.unit),money(a.billed),money(a.paid),a.credit>0?'Credit '+money(a.credit):'<b>'+money(a.out)+'</b>']));
 case'payments':return tbl(['Date','Tenant','Channel','Reference','Amount'],pm.sort((a,b)=>a.date<b.date?-1:1).map(p=>[dmy(p.date),esc(tname(p.tid)),esc(chName(p.ch)),esc(p.ref),money(p.amount)]));
 case'water':return tbl(['Tenant','Unit','Previous','Current','Units','Water charge'],S.readings.filter(r=>r.month===m&&!r.first).map(r=>{const t=T_(r.tid)||{};return[esc(t.name),esc(t.unit),r.prev,r.cur,r.units,money(r.units*r.rate)]}));
 case'income':{const by={};validPays().filter(p=>p.date.slice(0,7)===m).forEach(p=>{(p.alloc||[]).filter(a=>!isDep(a.ty)).forEach(a=>by[a.ty]=r2((by[a.ty]||0)+a.amt));const u=r2(p.amount-allocSum(p));if(u>0)by.__un=r2((by.__un||0)+u)});return tbl(['Charge','Income received in '+mlabel(m)],Object.keys(by).map(k=>[k==='__un'?'Not yet allocated':esc(tyName(k)),money(by[k])]))}
 case'channels':return tbl(['Channel','Method','Payments (month)','Amount (month)','All time'],S.channels.map(c=>{const a=chStats(c,'month'),b=chStats(c,'all');return[esc(c.label),c.method,a.n,money(a.t),money(b.t)]}));
 case'unmatched':return payRows(S.payments.filter(p=>p.status!=='reversed'&&!p.tid));
